name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  prometheus-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate alert rules with promtool
        run: |
          docker run --rm --entrypoint promtool \
            -v "${{ github.workspace }}/ansible/roles/prometheus/files:/etc/prometheus:ro" \
            prom/prometheus:v2.54.1 \
            check rules /etc/prometheus/alerts.yml

  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ansible-lint
        run: pip install ansible-core ansible-lint
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: Prepare inventory for lint
        run: |
          cp ansible/inventory.ini.example ansible/inventory.ini
          sed -i 's/<app_ip>/127.0.0.1/g; s/<monitoring_ip>/127.0.0.2/g; s|<github_user>|ci|g' ansible/inventory.ini
      - name: Lint Ansible playbooks
        run: make ansible-lint
