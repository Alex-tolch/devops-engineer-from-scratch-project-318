---
- name: Prepare server and deploy bulletin board
  hosts: app
  gather_facts: true
  vars_files:
    - group_vars/app/vars.yml
    - group_vars/app/vault.yml
  roles:
    - role: docker
      tags: [setup, docker]
    - role: app
      tags: [deploy, app, setup]
    - role: node_exporter
      tags: [setup, monitoring, node_exporter]
    - role: metrics_proxy
      tags: [setup, monitoring, metrics_proxy]
    - role: nginx_prometheus_exporter
      tags: [setup, monitoring, nginx_exporter]
    - role: promtail
      tags: [setup, monitoring, promtail, loki]

- name: Deploy Prometheus monitoring server
  hosts: monitoring
  gather_facts: true
  vars_files:
    - group_vars/monitoring/vars.yml
    - group_vars/app/vault.yml
  roles:
    - role: docker
      tags: [setup, docker, prometheus, grafana, loki]
    - role: prometheus
      tags: [setup, prometheus, monitoring]
    - role: loki
      tags: [setup, loki, monitoring]
    - role: grafana
      tags: [setup, grafana, monitoring]
