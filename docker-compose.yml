services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bulletins
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - bulletin-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bulletins"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: ${DOCKER_IMAGE:-bulletins-app:local}
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bulletins
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bulletin-net
    restart: unless-stopped

networks:
  bulletin-net:
    name: bulletin-net

volumes:
  pgdata:
